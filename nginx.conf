server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Django collectstatic output, stored on the VPS under ./staticfiles.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Django media uploads, stored on the VPS under ./media.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        return 404;
    }
}
