# Compression for static assets and proxied Django responses. Stock nginx
# images do not ship Brotli, so gzip is the supported option here.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/x-javascript
    application/rss+xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Django collectstatic output, stored on the VPS under ./staticfiles.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
        # collectstatic fingerprints asset names, so a cached file never changes.
        add_header Cache-Control "public, max-age=604800, immutable";
        # Static assets are served from the same origin as the app now, but keep
        # the header for any older clients/bookmarks still using the old port.
        add_header Access-Control-Allow-Origin "*";
    }

    # Django media uploads, stored on the VPS under ./media/.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    # Everything else goes to Django. This keeps the admin HTML and its static
    # assets on one origin, so the browser reuses a single keep-alive connection
    # instead of opening a second set of connections to a separate static port.
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
