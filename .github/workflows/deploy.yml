name: deploy

# Branch lifecycle: dev -> staging -> main.
# dev, staging and main all run the backend and frontend test workflows, but
# dev is not deployed. staging and main are deployed automatically to separate
# ports on the same VPS, only after both test workflows pass.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - main

jobs:
  backend-tests:
    name: Backend Tests
    uses: ./.github/workflows/backend-tests.yml

  frontend-tests:
    name: Frontend Tests
    uses: ./.github/workflows/frontend-tests.yml

  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'main' || 'staging') }}
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy compose stack on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            ENV_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'main' || 'staging') }}"
            REF="${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}"
            DEPLOY_DIR="/srv/digi-$ENV_NAME"

            echo "=== Deploying $ENV_NAME from $REF into $DEPLOY_DIR ==="
            mkdir -p "$DEPLOY_DIR/staticfiles" "$DEPLOY_DIR/media"
            cd "$DEPLOY_DIR"

            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/saadaoui-salah/digi-ecommerce.git
            fi
            git fetch --all
            git reset --hard "origin/$REF"

            # Non-secret environment values (ports, URLs) are created once and
            # then left alone so local VPS tweaks survive later deploys.
            cp --update=none ".env.$ENV_NAME.example" ".env.$ENV_NAME" || true
            # The public host lives only in the VPS_HOST secret, never in git.
            sed -i "s|example.com|${{ secrets.VPS_HOST }}|g" ".env.$ENV_NAME"

            # Secret values come from the per-environment PostgreSQL
            # credentials. Create them here if prepare has not run yet, so a
            # first deploy on a fresh VPS cannot fail on a missing file.
            if [ ! -f .env.secrets ]; then
              PG_ENV="/root/.django_pg.env"
              DB_NAME="django_db"
              DB_USER="django_user"
              if [ "$ENV_NAME" = "staging" ]; then
                PG_ENV="/root/.django_pg_staging.env"
                DB_NAME="django_staging_db"
                DB_USER="django_staging_user"
              fi
              if [ ! -f "$PG_ENV" ]; then
                DB_PASS="$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-32)"
                printf '%s\n' "DB_NAME=$DB_NAME" "DB_USER=$DB_USER" "DB_PASSWORD=$DB_PASS" "DB_HOST=127.0.0.1" "DB_PORT=5432" > "$PG_ENV"
                chmod 600 "$PG_ENV"
                runuser -u postgres -- psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='$DB_USER'" postgres | grep -q 1 || runuser -u postgres -- psql -c "CREATE USER $DB_USER WITH PASSWORD '$DB_PASS';" postgres
                runuser -u postgres -- psql -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'" postgres | grep -q 1 || runuser -u postgres -- createdb -O "$DB_USER" "$DB_NAME"
                runuser -u postgres -- psql -c "GRANT ALL PRIVILEGES ON DATABASE $DB_NAME TO $DB_USER;" postgres
              fi
              . "$PG_ENV"
              SECRET_KEY="$(openssl rand -base64 48)"
              printf '%s\n' "SECRET_KEY=$SECRET_KEY" "DATABASE_URL=postgres://$DB_USER:$DB_PASSWORD@host.docker.internal:5432/$DB_NAME" "DB_PASSWORD=$DB_PASSWORD" > .env.secrets
              chmod 600 .env.secrets
            fi

            echo "=== Building images ==="
            docker compose --env-file ".env.$ENV_NAME" build

            echo "=== Running migrations and collectstatic ==="
            docker compose --env-file ".env.$ENV_NAME" run --rm backend python manage.py migrate --noinput
            docker compose --env-file ".env.$ENV_NAME" run --rm backend python manage.py load_geoalgeria
            docker compose --env-file ".env.$ENV_NAME" run --rm backend python manage.py collectstatic --noinput

            echo "=== Starting stack ==="
            docker compose --env-file ".env.$ENV_NAME" up -d --remove-orphans
            docker compose --env-file ".env.$ENV_NAME" ps
            echo "=== Deploy complete: $ENV_NAME ==="
