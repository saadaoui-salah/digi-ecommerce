name: Backend Tests

# Runs Django checks and tests on dev, staging and main, plus every pull
# request aimed at them. Reusable by the deploy workflow via workflow_call.
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_call:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the project
        run: python manage.py check

      - name: Check that the migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Run the tests
        run: python manage.py test --verbosity 2
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: "false"
          ALLOWED_HOSTS: "*"
          DATABASE_URL: sqlite:///db.sqlite3
