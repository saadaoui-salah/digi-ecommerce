name: Tests

# The tests run on every push to main and staging and on every pull request
# aimed at them. The deploy workflow waits for this one, so nothing reaches
# the server before the tests are green.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the project
        run: python manage.py check

      - name: Check that the migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Run the tests
        run: python manage.py test --verbosity 2
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: "false"
          ALLOWED_HOSTS: "*"
          DATABASE_URL: sqlite:///db.sqlite3

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
