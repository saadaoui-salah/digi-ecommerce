# Docker Compose stack for digi-ecommerce.
#
# Default: Django connects to the PostgreSQL 18 service installed on the VPS
# host through host.docker.internal. An optional containerised Postgres is
# available under the "container-db" profile if you prefer a fully isolated DB.
#
# Copy .env.secrets.example -> .env.secrets on the VPS and fill in the real
# SECRET_KEY / DATABASE_URL before starting.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env.secrets
    environment:
      DEBUG: "false"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-2.25.13.160,localhost,127.0.0.1,backend}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://2.25.13.160:3000,http://2.25.13.160:3002}"
      STATIC_URL: "${STATIC_URL:-http://2.25.13.160:8079/static/}"
      MEDIA_URL: "${MEDIA_URL:-http://2.25.13.160:8079/media/}"
      # HTTP-only deployment: Secure cookies would never be stored.
      AUTH_COOKIE_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://2.25.13.160:8000}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # Serves collectstatic output and user uploads directly from VPS directories.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8079}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/var/www/static:ro
      - ./media:/var/www/media:ro

  # Optional: enable with `docker compose --profile container-db up -d` and
  # set DATABASE_URL=postgres://django_user:<password>@db:5432/django_db
  db:
    image: postgres:18-alpine
    profiles: ["container-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-me}"
    ports:
      - "${CONTAINER_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
